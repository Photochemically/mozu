plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.expedition'
version = '0.3.0-dev'
base { archivesName = 'expedition-dimdoors-bridge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('local:dimdoors:5.4.4')
    implementation fg.deobf('local:architectury:9.2.14')
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    manifest.attributes(['Specification-Title':'Expedition Dimensional Doors Bridge',
                         'Implementation-Version':project.version,
                         'MixinConfigs':'expedition_bridge.mixins.json'])
    finalizedBy 'reobfJar'
}
